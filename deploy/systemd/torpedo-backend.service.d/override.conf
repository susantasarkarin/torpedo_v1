[Service]
# Graceful shutdown: uvicorn force-closes lingering connections (e.g. cint
# WebSocket clients) after 10s instead of hanging until TimeoutStopSec, so
# restarts/deploys take a few seconds rather than ~90s of 502s.
ExecStart=
ExecStart=/var/www/campaign_platform/backend/venv/bin/python -m uvicorn main:app --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 10
TimeoutStopSec=20

# Contain OOM to this service instead of letting the kernel OOM-killer pick a
# victim like mongod. On a 1-vCPU/2GB box the backend steady-states ~450MB and
# spikes toward ~780MB during cint opportunity webhooks; 1000M leaves headroom.
# On OOM the cgroup is killed and Restart=always brings only this service back.
MemoryAccounting=yes
MemoryMax=1000M
OOMPolicy=kill
Restart=always
RestartSec=5
