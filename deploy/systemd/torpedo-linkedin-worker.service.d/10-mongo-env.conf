[Service]
# The base unit's EnvironmentFile points at /etc/torpedo/linkedin-automation.env,
# which is empty on prod (0 bytes) -> MONGO_URI unset -> backend/db_pools.py asserts
# "MONGO_URI not set — refusing to start" -> the worker crash-loops (Restart=always),
# starving the 1-vCPU/2GB box and causing API 502s. Point it at the real env file.
EnvironmentFile=-/var/www/campaign_platform/backend/.env
