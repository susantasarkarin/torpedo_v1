<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Survey — Cogentix Research</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <!--
    Entry dispatcher: the platform's generated entry link is /survey/?study_id=...
    For cx_survey studies we hand off to the standalone CX renderer at /cx-survey/;
    for every other (health-syndicate) study we load the original built bundle
    exactly as before. On any lookup failure we fall back to the health bundle.
  -->
  <script>
  (function () {
    var p = new URLSearchParams(location.search);
    var sid = p.get("study_id");
    function loadHealth() {
      var css = document.createElement("link");
      css.rel = "stylesheet"; css.crossOrigin = ""; css.href = "/survey/assets/index-ByU0I89F.css";
      document.head.appendChild(css);
      var s = document.createElement("script");
      s.type = "module"; s.crossOrigin = ""; s.src = "/survey/assets/index-B3tU2e59.js";
      document.body.appendChild(s);
    }
    if (!sid) { loadHealth(); return; }
    fetch("/qre-api/api/studies/" + encodeURIComponent(sid))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (st) {
        if (st && st.type === "cx_survey") { location.replace("/cx-survey/" + location.search); }
        else { loadHealth(); }
      })
      .catch(loadHealth);
  })();
  </script>
</body>
</html>
