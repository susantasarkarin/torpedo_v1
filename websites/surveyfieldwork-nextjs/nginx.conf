# ===========================================
# Nginx Configuration for SurveyFieldwork.com
# ===========================================
# Place this file in /etc/nginx/sites-available/surveyfieldwork.com
# Then create symlink: sudo ln -s /etc/nginx/sites-available/surveyfieldwork.com /etc/nginx/sites-enabled/

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name surveyfieldwork.com www.surveyfieldwork.com;
    
    # For Let's Encrypt certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Main HTTPS server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name surveyfieldwork.com www.surveyfieldwork.com;

    # Allow larger uploads (CSV imports, etc.)
    client_max_body_size 20M;

    # SSL Configuration (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/surveyfieldwork.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/surveyfieldwork.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/surveyfieldwork.com/chain.pem;

    # SSL Security Settings
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (uncomment after testing)
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Logging
    access_log /var/log/nginx/surveyfieldwork.access.log;
    error_log /var/log/nginx/surveyfieldwork.error.log;

    # Next.js static files (served directly by Nginx for better performance)
    location /_next/static {
        alias /var/www/surveyfieldwork-nextjs/.next/static;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Public assets
    location /assets {
        alias /var/www/surveyfieldwork-nextjs/public/assets;
        expires 1M;
        add_header Cache-Control "public";
    }

    # Favicon and other root static files
    location ~* ^/(favicon\.ico|robots\.txt|sitemap\.xml|manifest\.json)$ {
        root /var/www/surveyfieldwork-nextjs/public;
        expires 1M;
        add_header Cache-Control "public";
    }

    # Proxy to Next.js application
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass CloudFlare header for accurate IP detection
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

# ===========================================
# CRM Backend API (if running on same server)
# ===========================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.surveyfieldwork.com;

    # Allow larger uploads to API
    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/surveyfieldwork.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/surveyfieldwork.com/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # CORS headers for API
    add_header Access-Control-Allow-Origin "https://surveyfieldwork.com" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

    location / {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass CloudFlare header for accurate IP detection
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }
}
