name: CI

# Runs on every pull request, and is reusable (workflow_call) so the deploy
# workflow can gate production deploys on the same checks.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  backend-smoke:
    name: Backend smoke tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URI: mongodb://localhost:27017
      # CI-only values; production injects real secrets via environment.
      SESSION_SECRET: ci-not-a-real-secret-override-in-prod
      CRM_DB_NAME: crm_db_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CI dependencies
        run: pip install -r backend/requirements-ci.txt
      - name: Run CRM/AI foundation smoke tests
        run: >
          pytest -v
          backend/tests/smoke/test_crm_spine.py
          backend/tests/smoke/test_crm_models.py
          backend/tests/smoke/test_ai_engine.py
          backend/tests/smoke/test_old_mail_classifier.py
          backend/tests/smoke/test_follow_up_agent.py
          backend/tests/smoke/test_legacy_lead_migration.py
          backend/tests/smoke/test_auth_module.py

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Campaign_platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Campaign_platform/package-lock.json
      - run: npm ci
      - run: npm run build
