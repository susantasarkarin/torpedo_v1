name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-22.04
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URI: mongodb://localhost:27017
      SESSION_SECRET: ci-not-a-real-secret-override-in-prod
      CORS_ORIGINS: http://localhost:5173
      CRM_DB_NAME: crm_db_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CI dependencies
        run: pip install -r backend/requirements-ci.txt
      - name: Check every intra-project import resolves
        run: python backend/scripts/check_imports.py
      - name: No new direct AI clients outside ai_governance/
        run: python backend/scripts/check_ai_gateway.py
      - name: Run test suite
        run: pytest backend/tests -m "not smoke" -q
      - name: Verify the app imports and mounts every router
        run: pytest backend/tests/smoke/test_backend_startup.py -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: Campaign_platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Campaign_platform/package-lock.json
      - run: npm ci
      - run: npm run build

  dependency-audit:
    name: Dependency advisories
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements-ci.txt || true
          pip-audit -r backend/requirements-outreach.txt || true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (shipped dependencies only)
        working-directory: Campaign_platform
        run: npm audit --omit=dev || true

  no-secrets:
    name: No secrets or PII in the tree
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked credentials and data exports
        run: |
          set -e
          bad=$(git ls-files \
            | grep -E '(^|/)(token|credentials|service.account)[^/]*\.json$|(^|/)\.env$|leads_export/' \
            | grep -v '\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Tracked credential or data-export files detected:"
            echo "$bad"
            exit 1
          fi
          echo "clean"
