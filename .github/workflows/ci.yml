name: CI

# Runs on every pull request, and is reusable (workflow_call) so the deploy
# workflow can gate production deploys on the same checks.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URI: mongodb://localhost:27017
      # CI-only values; production injects real secrets via environment.
      SESSION_SECRET: ci-not-a-real-secret-override-in-prod
      CORS_ORIGINS: http://localhost:5173
      CRM_DB_NAME: crm_db_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CI dependencies
        run: pip install -r backend/requirements-ci.txt

      # The whole suite, not a hand-picked eighth of it (TOR-14).
      #
      # This used to run backend/tests/smoke minus seven ignored files plus
      # eight named lead-pipeline files — about a quarter of the tests, and the
      # quarter covering the newest module. Nothing exercised the CRM spine,
      # finance, traffic, CINT/CPX or the panel, all of which have tests that
      # were simply never run.
      #
      # The stated reason ("other files hang on collection") was stale: the
      # full suite collects in ~13s. What the excluded files actually need is a
      # RUNNING SERVER, which is a different problem and now has its own
      # marker. `-m "not smoke"` deselects exactly those.
      - name: Run test suite
        run: pytest backend/tests -m "not smoke" -q

      # The app has to be importable in-process, which it was not until the
      # sys.path bootstrap in backend/conftest.py (TOR-11). Run it separately
      # so a mount failure is unmistakable in the log: since router mounts now
      # raise instead of warning (TOR-05), this step is what stops a deploy
      # that would come up with a module missing.
      - name: Verify the app imports and mounts every router
        run: pytest backend/tests/smoke/test_backend_startup.py -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Campaign_platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Campaign_platform/package-lock.json
      - run: npm ci
      - run: npm run build

  no-secrets:
    name: No secrets or PII in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TOR-01/TOR-07 were both "a file that should never have been committed,
      # committed". .gitignore cannot help once a path is tracked, so assert it
      # directly and fail the build rather than discovering it in an audit.
      - name: Reject tracked credentials and data exports
        run: |
          set -e
          bad=$(git ls-files \
            | grep -E '(^|/)(token|credentials|service.account)[^/]*\.json$|(^|/)\.env$|leads_export/' \
            | grep -v '\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Tracked credential or data-export files detected:"
            echo "$bad"
            exit 1
          fi
          echo "clean"
