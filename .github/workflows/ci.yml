name: CI

# Runs on every pull request, and is reusable (workflow_call) so the deploy
# workflow can gate production deploys on the same checks.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  backend-smoke:
    name: Backend smoke tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URI: mongodb://localhost:27017
      # CI-only values; production injects real secrets via environment.
      SESSION_SECRET: ci-not-a-real-secret-override-in-prod
      CRM_DB_NAME: crm_db_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CI dependencies
        run: pip install -r backend/requirements-ci.txt
      - name: Run self-contained smoke tests
        # Run the whole smoke dir, ignoring tests that need a running server or
        # heavy prod-only deps. New self-contained tests are then auto-included
        # regardless of branch/merge order.
        run: >
          pytest -v backend/tests/smoke
          --ignore=backend/tests/smoke/test_auth.py
          --ignore=backend/tests/smoke/test_campaigns.py
          --ignore=backend/tests/smoke/test_contacts.py
          --ignore=backend/tests/smoke/test_leads.py
          --ignore=backend/tests/smoke/test_ai_generation.py
          --ignore=backend/tests/smoke/test_backend_startup.py
          --ignore=backend/tests/smoke/test_mail_integration.py

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Campaign_platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Campaign_platform/package-lock.json
      - run: npm ci
      - run: npm run build
