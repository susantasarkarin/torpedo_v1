name: Deploy to production VM

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip CI and deploy immediately (emergency only)"
        type: boolean
        default: false
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  # Gate: production deploy only proceeds if CI passes (unless skip_tests).
  tests:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_tests != true }}
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    needs: tests
    # Run deploy even when tests job is skipped (emergency skip_tests path).
    if: ${{ always() && (needs.tests.result == 'success' || needs.tests.result == 'skipped') }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SSH into VM and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /var/www/campaign_platform

            mkdir -p /root/backups
            BACKUP="/root/backups/predeploy-$(date +%Y%m%d-%H%M%S).patch"
            # Capture both staged and unstaged local edits before reset.
            git diff HEAD > "$BACKUP" || true
            if [ -s "$BACKUP" ]; then
              echo "Saved local VM edits to $BACKUP"
            else
              rm -f "$BACKUP"
              echo "No local VM edits to preserve"
            fi

            git fetch origin main
            git reset --hard origin/main

            # Re-apply local VM-only edits if any
            if [ -f "$BACKUP" ] && [ -s "$BACKUP" ]; then
              git apply --3way "$BACKUP" || {
                echo "WARNING: could not fully re-apply local patch; see $BACKUP" >&2
              }
            fi

            # Frontend build first so backend + dist go live together
            cd /var/www/campaign_platform/Campaign_platform
            npm install
            npm run build
            cd /var/www/campaign_platform

            source /var/www/campaign_platform/backend/venv/bin/activate
            pip install -r /var/www/campaign_platform/backend/requirements-outreach.txt

            sudo systemctl restart torpedo-backend torpedo-sales-worker \
              torpedo-linkedin-worker torpedo-linkedin-beat \
              torpedo-panel-worker torpedo-lead-gen-mcp

            if [ "${SKIP_QRE_RESTART:-}" = "true" ]; then
              echo "SKIP_QRE_RESTART set - leaving qre-backend on old code"
            elif pm2 describe qre-backend > /dev/null 2>&1; then
              pm2 restart qre-backend --update-env
              echo "qre-backend restarted"
            fi

            for i in $(seq 1 30); do
              if curl -sf -o /dev/null http://127.0.0.1:8000/docs; then
                echo "Backend healthy"
                break
              fi
              if [ "$i" = "30" ]; then
                echo "Backend failed health check after 300s" >&2
                systemctl status torpedo-backend --no-pager >&2 || true
                exit 1
              fi
              sleep 10
            done
            sudo nginx -s reload
            echo "Deploy complete: $(git rev-parse --short HEAD)"
