name: Deploy to Google Cloud VM

on:
  push:
    branches:
      - main

jobs:
  # Gate: production deploy only proceeds if the CI checks pass.
  tests:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SSH into VM and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: root
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -e
            cd /var/www/campaign_platform

            # This VM carries edits that exist in no git history (the QRE
            # routes are maintained directly on the box). `git reset --hard`
            # below would silently destroy them, so snapshot first and
            # re-apply after. Backups are kept, never overwritten.
            mkdir -p /root/backups
            BACKUP="/root/backups/predeploy-$(date +%Y%m%d-%H%M%S).patch"
            # MUST be `git diff HEAD`, not plain `git diff`: the previous
            # deploy's `git apply --3way` STAGES what it applies, and plain
            # diff misses staged changes — so run N's success made run N+1
            # snapshot nothing and hard-reset the VM-local QRE edits away.
            git diff HEAD > "$BACKUP"
            if [ -s "$BACKUP" ]; then
              echo "Saved VM-local changes -> $BACKUP"
            else
              rm -f "$BACKUP"
            fi

            git fetch origin main
            git reset --hard origin/main

            # Re-apply VM-local edits. A conflict must warn, not fail the
            # deploy: the snapshot above is the recovery path.
            if [ -n "$BACKUP" ] && [ -s "$BACKUP" ]; then
              if git apply --3way "$BACKUP"; then
                git reset -q  # unstage what --3way staged; keep worktree edits
                echo "Re-applied VM-local changes"
              else
                echo "WARNING: could not re-apply $BACKUP - restore manually" >&2
              fi
            fi

            source /var/www/campaign_platform/backend/venv/bin/activate
            pip install -r /var/www/campaign_platform/backend/requirements-outreach.txt
            # Restart EVERY service that imports repo code. Restarting only
            # backend+sales left celery workers from Jul 26 running pre-fix
            # send code for days (found via content_source=None on all sends).
            sudo systemctl restart torpedo-backend torpedo-sales-worker \
              torpedo-linkedin-worker torpedo-linkedin-beat \
              torpedo-panel-worker torpedo-lead-gen-mcp

            # qre-backend runs under pm2, NOT systemd, so it never picked up
            # deploys — its process had served Jul-26 code for 8 days. It is
            # a survey backend: a restart drops any in-flight respondent, so
            # skip it during active fielding by pushing with SKIP_QRE_RESTART
            # set on the runner, or restart manually at a quiet moment.
            # (sfw-api is also pm2 but serves /var/www/sfw_panel — not this
            # repo — so it is deliberately left alone.)
            if [ "${SKIP_QRE_RESTART:-}" = "true" ]; then
              echo "SKIP_QRE_RESTART set - leaving qre-backend on old code"
            elif pm2 describe qre-backend > /dev/null 2>&1; then
              pm2 restart qre-backend --update-env
              echo "qre-backend restarted"
            fi
            # Backend takes ~10-15s to bind :8000 — poll instead of a fixed sleep
            for i in $(seq 1 30); do
              if curl -sf -o /dev/null http://127.0.0.1:8000/docs; then
                echo "Backend healthy"
                break
              fi
              if [ "$i" = "30" ]; then
                echo "Backend failed health check after 300s" >&2
                systemctl status torpedo-backend --no-pager >&2 || true
                exit 1
              fi
              sleep 10
            done
            cd /var/www/campaign_platform/Campaign_platform
            npm install
            npm run build
            sudo nginx -s reload
