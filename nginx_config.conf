# Production nginx config for torpedo.cogentixresearch.com (139.59.32.72)
# Snapshot of the live /etc/nginx/sites-enabled/campaign-platform on the VM.
# This file is documentation, NOT the deployed artifact - edit the server
# copy and re-snapshot here, or changes will not take effect.
#
# gzip is enabled globally in /etc/nginx/nginx.conf (http block).

server {
    server_name torpedo.cogentixresearch.com 139.59.32.72;
    client_max_body_size 500m;

    # Static assets (assets/ and static/ dirs): serve directly, 404 if missing
    location ~* ^/(assets|static)/ {
        root /var/www/campaign_platform/Campaign_platform/dist;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA routes: always serve index.html with no-cache header
    location / {
        root /var/www/campaign_platform/Campaign_platform/dist;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri /index.html;
    }

    # CX Survey Frontend (IDFC FIRST Bank CX QRE respondent UI)
    location /cx-survey/ {
        alias /var/www/campaign_platform/qre_cx_frontend/;
        index index.html;
        try_files $uri $uri/ /cx-survey/index.html;
    }

    # QRE Survey Frontend (respondent-facing survey)
    location /survey/ {
        alias /var/www/campaign_platform/qre_frontend/;
        index index.html;
        try_files $uri $uri/ /survey/index.html;
    }

    # QRE Survey Platform API (port 8001)
    location /qre-api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Proxy all backend routes to FastAPI
    location ~ ^/(api|login|logout|profile|finance|settings|roles|approvals|gmail|gmail-ws|panel|users|leads|email-campaigns|email-sync|projects|support|mcp|cint-response|cpx-response|cpx-postback|response|survey-status|cpx|health|system|ws|transaction|admin/users|takesurvey|vendor-response|surveycomplete|surveyterminate|surveyquotafull|survey-allocation|survey-pool|automation|performance|mail|prompts|review-queue|classified-gmail|company-cache|email-patterns|campaigns|agents|inbox|sales|vendor-leads|marketing|deliverability|webhooks|lists|create-list|delete-list|contacts|templates|upload-csv|send-emails|reports|track)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 300s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/torpedo.cogentixresearch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/torpedo.cogentixresearch.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = torpedo.cogentixresearch.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name torpedo.cogentixresearch.com 139.59.32.72;
    client_max_body_size 500m;
    return 404;
}
