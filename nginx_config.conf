# Production nginx config for torpedo.cogentixresearch.com (139.59.32.72)
#
# THIS FILE IS THE DEPLOYED ARTIFACT (TOR-15). It used to be a snapshot that
# drifted from the live /etc/nginx/sites-enabled/campaign-platform, which meant
# the routing rules everything depends on lived only on the VM. Deploy it with:
#
#     sudo cp nginx_config.conf /etc/nginx/sites-available/campaign-platform
#     sudo nginx -t && sudo systemctl reload nginx
#
# gzip is enabled globally in /etc/nginx/nginx.conf (http block).

# ---------------------------------------------------------------------------
# Rate limit zones (TOR-10). Must be in the http{} context; if this file is
# included from sites-enabled (which is inside http{}), these belong here.
# 10m holds roughly 160k unique addresses.
#
# These shed volumetric abuse before it reaches Python. The app enforces the
# real per-identity policy itself (backend/middleware/rate_limit.py) — this is
# the cheap outer layer, deliberately looser than the app's own limits.
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=write_zone:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=600r/m;
limit_req_status 429;

server {
    server_name torpedo.cogentixresearch.com 139.59.32.72;
    client_max_body_size 500m;

    # -----------------------------------------------------------------------
    # Security headers (TOR-15). There were none.
    #
    # `always` so they are set on error responses too — a 401 or 500 body is
    # just as capable of carrying a reflected payload as a 200.
    # -----------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CSP is REPORT-ONLY for now, on purpose. The SPA is 84k lines with Vite
    # inline bootstrap and inline styles throughout; enforcing this policy
    # today would white-screen the app. Report-only puts the violations in the
    # browser console so the real inline usage can be found and removed, after
    # which this becomes Content-Security-Policy and the session token stops
    # being one XSS away from theft (TOR-25).
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Static assets (assets/ and static/ dirs): serve directly, 404 if missing
    location ~* ^/(assets|static)/ {
        root /var/www/campaign_platform/Campaign_platform/dist;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # NOTE: nginx add_header does NOT inherit into a location that sets
        # any add_header of its own — so the server-level security headers
        # must be repeated here or the SPA's own HTML document, the single
        # most important place for them, would ship without any.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # SPA routes: always serve index.html with no-cache header
    location / {
        root /var/www/campaign_platform/Campaign_platform/dist;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        # NOTE: nginx add_header does NOT inherit into a location that sets
        # any add_header of its own — so the server-level security headers
        # must be repeated here or the SPA's own HTML document, the single
        # most important place for them, would ship without any.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /index.html;
    }

    # CX Survey Frontend (IDFC FIRST Bank CX QRE respondent UI)
    location /cx-survey/ {
        alias /var/www/campaign_platform/qre_cx_frontend/;
        index index.html;
        try_files $uri $uri/ /cx-survey/index.html;
    }

    # QRE Survey Frontend (respondent-facing survey)
    location /survey/ {
        alias /var/www/campaign_platform/qre_frontend/;
        index index.html;
        try_files $uri $uri/ /survey/index.html;
    }

    # QRE Survey Platform API (port 8001)
    location /qre-api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # -----------------------------------------------------------------------
    # Rate-limited entry points. These come BEFORE the catch-all proxy block
    # below because nginx picks the longest matching prefix location before
    # evaluating regex locations — exact-prefix wins here.
    # -----------------------------------------------------------------------
    location = /login/ {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        # Strip the internal service-token header from every inbound request
        # (TOR-50). app/security.py honours `X-Service-Token` as a full
        # authorization bypass; the only legitimate caller (lead_gen_mcp) talks
        # to 127.0.0.1:8000 directly and never comes through nginx, so clearing
        # it here costs nothing and closes what would otherwise be a
        # one-header auth bypass reachable from the internet.
        proxy_set_header X-Service-Token "";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 300s;
    }

    location = /api/login/ {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        # Strip the internal service-token header from every inbound request
        # (TOR-50). app/security.py honours `X-Service-Token` as a full
        # authorization bypass; the only legitimate caller (lead_gen_mcp) talks
        # to 127.0.0.1:8000 directly and never comes through nginx, so clearing
        # it here costs nothing and closes what would otherwise be a
        # one-header auth bypass reachable from the internet.
        proxy_set_header X-Service-Token "";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 300s;
    }

    location = /api/crm/web-to-lead {
        limit_req zone=write_zone burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        # Strip the internal service-token header from every inbound request
        # (TOR-50). app/security.py honours `X-Service-Token` as a full
        # authorization bypass; the only legitimate caller (lead_gen_mcp) talks
        # to 127.0.0.1:8000 directly and never comes through nginx, so clearing
        # it here costs nothing and closes what would otherwise be a
        # one-header auth bypass reachable from the internet.
        proxy_set_header X-Service-Token "";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 300s;
    }

    location /panel/signup {
        limit_req zone=write_zone burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        # Strip the internal service-token header from every inbound request
        # (TOR-50). app/security.py honours `X-Service-Token` as a full
        # authorization bypass; the only legitimate caller (lead_gen_mcp) talks
        # to 127.0.0.1:8000 directly and never comes through nginx, so clearing
        # it here costs nothing and closes what would otherwise be a
        # one-header auth bypass reachable from the internet.
        proxy_set_header X-Service-Token "";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 300s;
    }

    # -----------------------------------------------------------------------
    # Backend catch-all.
    #
    # KNOWN SHARP EDGE: this is a hand-maintained list of ~50 top-level
    # prefixes. A new backend route whose prefix is not here is served the
    # SPA's index.html instead — a 200 with HTML where the caller expected
    # JSON, which surfaces as a confusing parse error rather than a 404.
    #
    # The real fix is to move every backend route under a single /api prefix
    # so this becomes one line. That is deliberately NOT done here: it changes
    # the URL of every endpoint and would need all 386 frontend call sites
    # updated in the same commit. Tracked as the remaining half of TOR-15.
    # -----------------------------------------------------------------------
    location ~ ^/(api|login|logout|profile|finance|settings|roles|approvals|gmail|gmail-ws|panel|users|leads|email-campaigns|email-sync|projects|support|mcp|cint-response|cpx-response|cpx-postback|response|survey-status|cpx|health|system|ws|transaction|admin/users|takesurvey|vendor-response|surveycomplete|surveyterminate|surveyquotafull|survey-allocation|survey-pool|automation|performance|mail|prompts|review-queue|classified-gmail|company-cache|email-patterns|campaigns|agents|inbox|sales|vendor-leads|marketing|deliverability|webhooks|lists|create-list|delete-list|contacts|templates|upload-csv|send-emails|reports|track)(/|$) {
        limit_req zone=api_zone burst=100 nodelay;
        proxy_pass http://127.0.0.1:8000;
        # Strip the internal service-token header from every inbound request
        # (TOR-50). app/security.py honours `X-Service-Token` as a full
        # authorization bypass; the only legitimate caller (lead_gen_mcp) talks
        # to 127.0.0.1:8000 directly and never comes through nginx, so clearing
        # it here costs nothing and closes what would otherwise be a
        # one-header auth bypass reachable from the internet.
        proxy_set_header X-Service-Token "";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 300s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/torpedo.cogentixresearch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/torpedo.cogentixresearch.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = torpedo.cogentixresearch.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name torpedo.cogentixresearch.com 139.59.32.72;
    client_max_body_size 500m;
    return 404;
}
