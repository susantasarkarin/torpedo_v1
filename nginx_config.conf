server {
    server_name torpedo.cogentixresearch.com 139.59.32.72;
    client_max_body_size 500m;

    location / {
        root /var/www/campaign_platform/Campaign_platform/dist;
        try_files $uri $uri/ /index.html;
    }

    # QRE Survey Platform API (port 8001)
    location /qre-api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Proxy all backend routes to FastAPI
    location ~ ^/(api|login|logout|profile|finance|settings|roles|approvals|gmail|panel|users|leads|email-campaigns|email-sync|projects|support|mcp|cint-response|cpx-response|cpx-postback|response|survey-status|cpx|health|system|ws|transaction|admin/users|takesurvey|vendor-response|surveycomplete|surveyterminate|surveyquotafull)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 300s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/torpedo.cogentixresearch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/torpedo.cogentixresearch.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = torpedo.cogentixresearch.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name torpedo.cogentixresearch.com 139.59.32.72;
    client_max_body_size 500m;
    return 404;
}
