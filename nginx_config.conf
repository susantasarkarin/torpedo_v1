server {
    server_name torpedo.cogentixresearch.com 139.59.32.72;
    client_max_body_size 500m;

    # ============== GZIP COMPRESSION ==============
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ============== PROXY CACHE ZONE ==============
    # Defined in http block - if not already there, add:
    # proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=5m;

    location / {
        root /var/www/campaign_platform/Campaign_platform/dist;
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Cache HTML with revalidation
        location ~* \.html$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }
    }

    # QRE Survey Frontend (respondent-facing survey)
    location /survey/ {
        alias /var/www/campaign_platform/qre_frontend/;
        index index.html;
        try_files $uri $uri/ /survey/index.html;

        # Cache survey static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # QRE Survey Platform API (port 8001)
    location /qre-api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
    }

    # Proxy all backend routes to FastAPI
    location ~ ^/(api|login|logout|profile|finance|settings|roles|approvals|gmail|gmail-ws|panel|users|leads|email-campaigns|email-sync|projects|support|mcp|cint-response|cpx-response|cpx-postback|response|survey-status|cpx|health|system|ws|transaction|admin/users|takesurvey|vendor-response|surveycomplete|surveyterminate|surveyquotafull|survey-allocation|survey-pool|automation|performance|mail|prompts|review-queue|classified-gmail|company-cache|email-patterns|campaigns|agents|inbox|sales|vendor-leads|marketing|deliverability)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;

        # Buffer proxy responses for faster delivery
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/torpedo.cogentixresearch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/torpedo.cogentixresearch.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = torpedo.cogentixresearch.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name torpedo.cogentixresearch.com 139.59.32.72;
    client_max_body_size 500m;
    return 404;
}
