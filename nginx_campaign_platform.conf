server {
    server_name torpedo.cogentixresearch.com 139.59.32.72;

    # Frontend static files
    location / {
        root /var/www/campaign_platform/Campaign_platform/dist;
        try_files $uri $uri/ /index.html;
    }

    # All API routes - proxy to backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Backend routes without /api prefix
    location ~ ^/(login|traffic|finance|survey-pool|cpx|settings|health|performance|gmail|gmail-ws|survey-allocation|leads|agents|panel|clay|rfq|operations|sales|accounts|users|roles|vendors|inbox|support|classification|campaigns|marketing|vendor-leads|ws)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/torpedo.cogentixresearch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/torpedo.cogentixresearch.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = torpedo.cogentixresearch.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name torpedo.cogentixresearch.com 139.59.32.72;
    return 404;
}
